<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This week's changes · AI Regulation Map</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="canonical" href="https://airegulationmap.org/changes.html">
  <link rel="alternate" type="application/atom+xml" title="AI Regulation Map: weekly changes" href="/digest/feed.xml">

  <meta name="description" content="What changed in the AI Regulation Map after the latest research run: score movements and new laws by country, each linked to its sources.">

  <meta property="og:type" content="article">
  <meta property="og:title" content="This week's changes · AI Regulation Map">
  <meta property="og:description" content="Score movements and new laws by country after the latest research run, each linked to its sources.">
  <meta property="og:image" content="https://airegulationmap.org/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://airegulationmap.org/changes.html">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="This week's changes · AI Regulation Map">
  <meta name="twitter:description" content="Score movements and new laws by country after the latest research run, with sources.">
  <meta name="twitter:image" content="https://airegulationmap.org/og-image.png">

  <!-- Resolve theme before paint. URL > localStorage > prefers-color-scheme. -->
  <script>
    (function () {
      try {
        var urlTheme = new URLSearchParams(location.search).get('theme');
        if (urlTheme === 'light' || urlTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', urlTheme);
          return;
        }
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* storage blocked */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Tokens: mirror of the main app's _tokens.css, trimmed to what
       this page actually uses. Kept inline so methodology.html renders
       correctly even if the main bundle is unavailable. */
    :root {
      --brand-hue: 75;
      --radius: 8px;
      --radius-sm: 5px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      --bg:              oklch(15% 0.008 var(--brand-hue));
      --surface:         oklch(19% 0.009 var(--brand-hue));
      --surface-raised:  oklch(23% 0.010 var(--brand-hue));
      --border:          oklch(30% 0.013 var(--brand-hue));
      --border-subtle:   oklch(24% 0.010 var(--brand-hue));

      --text-primary:    oklch(92% 0.012 var(--brand-hue));
      --text-secondary:  oklch(72% 0.014 var(--brand-hue));
      --text-tertiary:   oklch(58% 0.014 var(--brand-hue));

      --accent:          oklch(76% 0.13 var(--brand-hue));
      --accent-muted:    oklch(76% 0.13 var(--brand-hue) / 0.14);

      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        --bg:              oklch(98% 0.003 80);
        --surface:         oklch(99.5% 0.002 80);
        --surface-raised:  oklch(100% 0 0);
        --border:          oklch(88% 0.008 80);
        --border-subtle:   oklch(94% 0.004 80);
        --text-primary:    oklch(20% 0.013 80);
        --text-secondary:  oklch(42% 0.014 80);
        --text-tertiary:   oklch(58% 0.014 80);
        --accent:          oklch(48% 0.16 60);
        --accent-muted:    oklch(48% 0.16 60 / 0.10);
        color-scheme: light;
      }
    }

    :root[data-theme='light'] {
      --bg:              oklch(98% 0.003 80);
      --surface:         oklch(99.5% 0.002 80);
      --surface-raised:  oklch(100% 0 0);
      --border:          oklch(88% 0.008 80);
      --border-subtle:   oklch(94% 0.004 80);
      --text-primary:    oklch(20% 0.013 80);
      --text-secondary:  oklch(42% 0.014 80);
      --text-tertiary:   oklch(58% 0.014 80);
      --accent:          oklch(48% 0.16 60);
      --accent-muted:    oklch(48% 0.16 60 / 0.10);
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Geist', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.65;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { filter: brightness(1.1); }

    header.site-header {
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    header.site-header a.site-title {
      font-family: 'Literata', Georgia, serif;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.005em;
    }

    header.site-header a.site-title:hover { color: var(--accent); }

    header.site-header nav {
      color: var(--text-tertiary);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    header.site-header nav span { color: var(--text-primary); }

    main.doc {
      max-width: 68ch;
      margin: 48px auto 96px;
      padding: 0 28px;
    }

    h1.doc-title {
      font-family: 'Literata', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.012em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    p.doc-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 36px;
      max-width: 54ch;
    }

    h2 {
      font-family: 'Literata', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: -0.005em;
      color: var(--text-primary);
      margin: 52px 0 10px;
      scroll-margin-top: 24px;
    }

    h3 {
      font-family: 'Geist', -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin: 28px 0 8px;
    }

    p { color: var(--text-secondary); margin-bottom: 14px; }
    p strong { color: var(--text-primary); font-weight: 500; }

    ul, ol {
      color: var(--text-secondary);
      padding-left: 22px;
      margin-bottom: 14px;
    }

    li { margin-bottom: 6px; }

    .rubric {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      overflow: hidden;
      margin: 14px 0 20px;
      font-size: 0.9rem;
    }

    .rubric-row {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 16px;
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .rubric-row:first-child { border-top: 0; }

    .rubric-score {
      font-family: 'Geist Mono', 'JetBrains Mono', monospace;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .rubric-body { color: var(--text-secondary); line-height: 1.55; }
    .rubric-body em {
      color: var(--text-tertiary);
      font-style: italic;
      display: block;
      margin-top: 3px;
      font-size: 0.82rem;
    }

    .callout {
      background: var(--accent-muted);
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      margin: 20px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .callout strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text-primary);
      font-family: 'Literata', Georgia, serif;
      font-weight: 500;
    }

    code, pre {
      font-family: 'Geist Mono', 'JetBrains Mono', monospace;
      font-size: 0.85em;
      color: var(--text-primary);
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 3px;
    }

    pre {
      padding: 14px 18px;
      overflow-x: auto;
      line-height: 1.5;
      font-size: 0.82rem;
    }

    footer.site-footer {
      border-top: 1px solid var(--border);
      padding: 24px 32px;
      color: var(--text-tertiary);
      font-size: 0.8rem;
      text-align: center;
    }

    /* Print: strip chrome, inline everything, use black-on-white. */
    @media print {
      body { background: white; color: black; font-size: 11pt; }
      header.site-header, footer.site-footer { display: none; }
      main.doc { max-width: none; margin: 0; padding: 0; }
      h1.doc-title, h2, h3 { color: black; }
      p, li { color: #222; }
      a { color: black; text-decoration: none; }
      a[href]::after { content: " (" attr(href) ")"; font-size: 0.85em; color: #555; }
      .rubric { border-color: #bbb; }
      .rubric-row { border-color: #ddd; }
      .rubric-score { color: black; }
      .callout { background: #f2f2f2; }
    }

    /* Respect user motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }

    /* Header links + theme toggle (same pattern as data.html). */
    header.site-header .header-links {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.82rem;
    }
    header.site-header .header-links a { color: var(--text-secondary); text-decoration: none; }
    header.site-header .header-links a:hover { color: var(--accent); }
    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 30px; height: 30px; padding: 0;
      cursor: pointer;
      color: var(--text-secondary);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .theme-toggle:hover { color: var(--text-primary); border-color: var(--accent); }
    .theme-icon { width: 15px; height: 15px; }
    .theme-icon-sun { display: none; }
    :root[data-theme='dark'] .theme-icon-sun { display: inline; }
    :root[data-theme='dark'] .theme-icon-moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .theme-icon-sun { display: inline; }
      :root:not([data-theme]) .theme-icon-moon { display: none; }
    }

    /* Digest */
    .digest-meta {
      font-family: 'Geist Mono', 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-tertiary);
      margin: -24px 0 28px;
    }
    .digest-meta code { font-size: 1em; padding: 1px 5px; }

    .digest-lead {
      font-family: 'Literata', Georgia, serif;
      font-size: 1.1rem;
      line-height: 1.55;
      color: var(--text-primary);
      margin-bottom: 36px;
      max-width: 60ch;
    }

    .change {
      padding: 22px 0 26px;
      border-top: 1px solid var(--border-subtle);
    }
    .change:last-of-type { border-bottom: 1px solid var(--border-subtle); }
    .change h2.change-country { margin: 0 0 4px; font-size: 1.2rem; }
    .change h2.change-country a { color: var(--text-primary); text-decoration: none; }
    .change h2.change-country a:hover { color: var(--accent); }
    .change-headline { color: var(--text-primary); font-weight: 500; margin-bottom: 8px; }
    .change-summary { margin-bottom: 12px; }

    .change-facts {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 4px 18px;
      font-size: 0.88rem;
      margin: 0 0 12px;
      color: var(--text-secondary);
    }
    .change-facts dt { color: var(--text-tertiary); }
    .change-facts dd {
      font-family: 'Geist Mono', 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .change h3 { margin: 14px 0 6px; }
    .change-sources { list-style: none; padding: 0; margin: 0; font-size: 0.88rem; }
    .change-sources li { margin-bottom: 3px; }
    .change-new {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-muted);
      padding: 1px 6px;
      border-radius: 3px;
      margin-left: 6px;
    }

    .change-uncovered { margin-top: 40px; }
    .change-uncovered h2, .digest-weeks h2 { margin-top: 44px; }
    .digest-weeks ul { list-style: none; padding: 0; }
    .digest-weeks li { margin-bottom: 6px; }
    .digest-weeks strong { color: var(--text-primary); font-weight: 500; }

    @media print {
      .change { break-inside: avoid; }
      .change-new { background: #f2f2f2; color: #333; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">AI Regulation Map</a>
    <nav aria-label="breadcrumb"><span>Changes</span></nav>
    <div class="header-links">
      <a href="/digest/feed.xml" title="Atom feed of weekly changes">Feed</a>
      <a href="/drift.html">Drift</a>
      <a href="/methodology.html">Methodology</a>
      <a href="/data.html">Data &amp; API</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="doc" id="digest" aria-live="polite">
    <h1 class="doc-title">This week's changes</h1>
    <p class="doc-subtitle">Loading the latest digest…</p>
    <noscript>
      <p>This page needs JavaScript to render the digest. The same content is
      available as <a href="/digest/index.json">JSON</a> and as an
      <a href="/digest/feed.xml">Atom feed</a>.</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <p><a href="/">&larr; Back to the map</a> &nbsp;·&nbsp; <a href="/digest/feed.xml">Atom feed</a> &nbsp;·&nbsp; <a href="/methodology.html">Methodology</a></p>
  </footer>

  <script type="module" src="/src/changes.ts"></script>
</body>
</html>
