name: Update AI Regulation Data

on:
  schedule:
    # The weekly run, Monday 06:17 UTC: the pipeline defaults research every
    # country with web search through the Batches API. Off the top of the
    # hour, when GitHub delays and drops the most scheduled runs (#189).
    - cron: '17 6 * * 1'
    # Collect runs (#194): a weekly batch still processing when its run's
    # wait ends is left running and recorded in state/open_batch.json; these
    # pick it up (--collect-only exits at once when nothing is recorded).
    # Batches end within 24h, so Monday and Tuesday cover it. Keep the
    # string in sync with INPUT_COLLECT below.
    - cron: '47 */2 * * 1,2'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Comma-separated countries to update (leave empty for every country; with force off, only stale or low-confidence ones)'
        required: false
        default: ''
      force_update:
        description: 'Re-research every selected country, ignoring staleness (default). Off = stale or low-confidence only.'
        required: false
        default: true
        type: boolean
      model:
        description: 'Claude model to use (leave empty for the pipeline default, claude-opus-5)'
        required: false
        default: ''
      search:
        description: 'Give the model web search for every country (default). A full run costs ~$100 on Opus 5 (search results dominate input tokens).'
        required: false
        default: true
        type: boolean
      batch:
        description: 'Use the Message Batches API (50% token pricing, results within 24h; a batch still running after 4h is collected by a later run)'
        required: false
        default: true
        type: boolean
      gate:
        description: 'Stability gate (default). Off applies every score; a full run then needs a break reason.'
        required: false
        default: true
        type: boolean
      break_reason:
        description: 'With gate off on a full run: why the scale moved (recorded as a calibration break in history.json).'
        required: false
        default: ''
      digest:
        description: 'Write the weekly changes digest (public/digest/) after the run. Scheduled runs always do.'
        required: false
        default: false
        type: boolean

# Never let two data runs (a manual dispatch overlapping the weekly cron)
# race to git push. cancel-in-progress: false queues the second run instead of
# clobbering the first mid-write.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Just under GitHub's 6h cap, stated so the budget is explicit: the batch
    # wait budget (batch.MAX_WAIT_SECONDS, 4h across all batches) plus
    # applying, mirroring, the digest and the commit must fit inside it.
    timeout-minutes: 355
    permissions:
      contents: write  # Required to commit updated CSV/JSON files back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip when the job starts, not the commit that triggered
          # it: a run queued behind another (the concurrency group above)
          # must see the open-batch record that run committed, or it would
          # submit a second batch and pay twice (#194).
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Refresh the verified policy-initiative records before researching, so
      # a grounded run reads current evidence. Gated on the repo variable
      # EVIDENCE_SYNC_ENABLED (flip to 'true' after the first successful
      # manual sync via evidence-sync.yml). continue-on-error + the module's
      # own warn-and-exit-0 network handling mean an OECD outage can never
      # break the data run.
      - name: Sync evidence (OECD)
        if: ${{ vars.EVIDENCE_SYNC_ENABLED == 'true' }}
        continue-on-error: true
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m regulation_pipeline.evidence sync --source oecd

      - name: Run data update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Supabase dual-write mirror (auto-activates when both are set;
          # mirror failures never fail the run).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INPUT_COUNTRIES: ${{ github.event.inputs.countries || '' }}
          # The pipeline defaults (force, search, batch) are the scheduled run.
          # Dispatch inputs only ever opt out of them.
          INPUT_MODEL: ${{ github.event.inputs.model && format('--model {0}', github.event.inputs.model) || '' }}
          INPUT_FORCE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_update == 'false') && '--no-force' || '' }}
          INPUT_SEARCH: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.search == 'false') && '--no-search' || '' }}
          INPUT_BATCH: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.batch == 'false') && '--no-batch' || '' }}
          INPUT_GROUNDED: ${{ (vars.EVIDENCE_SYNC_ENABLED == 'true') && '--grounded' || '' }}
          INPUT_GATE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.gate == 'false') && '--no-gate' || '' }}
          INPUT_BREAK_REASON: ${{ github.event.inputs.break_reason || '' }}
          # Scheduled runs write the digest by default (the CLI reads
          # GITHUB_EVENT_NAME); a dispatch opts in with the input.
          INPUT_DIGEST: ${{ (github.event.inputs.digest == 'true') && '--digest' || '' }}
          # The collect schedule only collects an open batch (#194).
          INPUT_COLLECT: ${{ (github.event.schedule == '47 */2 * * 1,2') && '--collect-only' || '' }}
        run: |
          # pipefail: tee must not mask the script's exit code - the
          # partial-failure contract (exit 1) drives the step status.
          set -o pipefail
          # The break reason carries spaces, so it goes through an array.
          extra=()
          if [ -n "$INPUT_BREAK_REASON" ]; then
            extra+=(--break-reason "$INPUT_BREAK_REASON")
          fi
          python scripts/update_data.py \
            --countries "$INPUT_COUNTRIES" \
            $INPUT_MODEL \
            $INPUT_FORCE \
            $INPUT_SEARCH \
            $INPUT_BATCH \
            $INPUT_GROUNDED \
            $INPUT_GATE \
            $INPUT_DIGEST \
            $INPUT_COLLECT \
            "${extra[@]}" 2>&1 | tee run.log

      - name: Run summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Data update"
            echo '```'
            grep -E "Countries to update|Done\.|Failed countries|mirror:|evidence|Gate:|digest:|gold:|usage:|rubric|links: [0-9]|eu: |Batch .* submitted|Follow-up batch|still processing|Collecting batch|Open batch|open batch|FATAL" run.log | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for changes
        id: changes
        # Run even if the update step reported failures (non-zero exit for
        # partial success): the countries that DID update are already written to
        # disk and must still be committed, or the whole week's work is lost.
        if: ${{ !cancelled() }}
        run: |
          # Stage first so the brand-new subscores.json (untracked on its
          # first run) is detected too.
          git add public/scores.csv public/regulation_data.csv public/history.json
          if [ -f public/data/subscores.json ]; then git add public/data/subscores.json; fi
          # pending.json: candidates the stability gate held for one run.
          if [ -f public/data/pending.json ]; then git add public/data/pending.json; fi
          # drift.json: one row of gold-set agreement metrics per run.
          if [ -f public/data/drift.json ]; then git add public/data/drift.json; fi
          # Weekly digest (week file, index, Atom feed) travels with the data.
          if [ -d public/digest ]; then git add public/digest; fi
          # The open-batch record (#194): written when a batch is handed
          # over, deleted once it is collected. -A stages the deletion.
          if [ -d state ] || git ls-files --error-unmatch state/open_batch.json >/dev/null 2>&1; then
            git add -A state
          fi
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      # Data commits are pushed with GITHUB_TOKEN, which never triggers CI,
      # so check here that the site still builds and its unit tests pass on
      # the new data before anything is pushed (#98). A failure keeps the
      # data as a workflow artifact instead. The dummy Supabase values put
      # the progressive-enhancement code in the bundle, as in CI's e2e job;
      # nothing is deployed from this build.
      - name: Set up Node
        if: ${{ !cancelled() && steps.changes.outputs.changed == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify the site builds with the new data
        id: verify
        if: ${{ !cancelled() && steps.changes.outputs.changed == 'true' }}
        env:
          VITE_SUPABASE_URL: https://test-project.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: |
          npm ci
          npm run build
          npm test
          # The build regenerates the committed slug index; a new or renamed
          # country changes it, and it must travel with the data (an
          # unstaged change would also stop the push's rebase retry).
          git add public/data/country_slugs.json

      - name: Commit and push updated data
        id: commit
        # Only ever push from the default branch - a manual dispatch on some
        # other ref must not write data commits there.
        if: ${{ !cancelled() && steps.changes.outputs.changed == 'true' && steps.verify.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "AI Regulation Bot"
          git config user.email "bot@github-actions"
          if git diff --cached --name-only | grep -qv '^state/'; then
            git commit -m "chore: automated data update $(date -u +%Y-%m-%d)"
          else
            git commit -m "chore: record the open research batch $(date -u +%Y-%m-%d)"
          fi
          # A merge to main during the (hours-long) run makes a plain push
          # non-fast-forward, and the week's data would be lost with the
          # runner. Rebase the data commit onto main and retry.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Rebase onto main failed; the data files are uploaded as an artifact"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the data commit; the data files are uploaded as an artifact"
          exit 1

      # Last resort so a paid run is never lost with the runner: if the
      # build check, the commit or the push failed, keep every file the
      # pipeline writes.
      - name: Upload data files if the commit failed
        if: ${{ !cancelled() && (steps.commit.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-update-${{ github.run_id }}
          path: |
            public/scores.csv
            public/regulation_data.csv
            public/history.json
            public/data/subscores.json
            public/data/pending.json
            public/data/drift.json
            public/digest/
            state/
            run.log
          retention-days: 30

      # The pushed data never runs CI, so run the Playwright smoke and
      # accessibility suite on it here. The data is already on main; a
      # failure turns this run red so the maintainer hears about it the day
      # it lands (a data change once broke tests/e2e/docs.spec.ts unseen).
      - name: Install Playwright browser
        id: e2e_setup
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Check the published data end to end
        if: ${{ !cancelled() && steps.e2e_setup.outcome == 'success' }}
        run: npm run test:e2e
