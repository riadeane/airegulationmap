name: Evidence Sync (OECD)

# Manual-dispatch evidence tooling:
#   probe      - no credentials; fetch page 1 from each candidate endpoint and
#                upload the dumps as an artifact (inspect before trusting a
#                shape change).
#   sync-delta - upsert initiatives whose updatedAt moved (plus new ones).
#   sync-full  - upsert every record.
# The weekly update-data workflow runs a delta sync automatically once the
# repository variable EVIDENCE_SYNC_ENABLED is "true".

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [probe, sync-delta, sync-full]
        default: probe
      endpoint:
        description: Optional endpoint override (blank = official, wrapper fallback)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: evidence-sync
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe endpoints
        if: inputs.mode == 'probe'
        run: python -m regulation_pipeline.evidence probe --out probe-output
        env:
          PYTHONPATH: scripts

      - name: Upload probe artifact
        if: inputs.mode == 'probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oecd-probe
          path: probe-output/
          retention-days: 30

      - name: Sync initiatives
        if: inputs.mode != 'probe'
        # Inputs reach the shell through env, never interpolated into the
        # script, so an endpoint value cannot inject commands.
        run: |
          args=(sync --source oecd)
          if [ "$MODE" = "sync-full" ]; then args+=(--full); fi
          if [ -n "$ENDPOINT" ]; then args+=(--endpoint "$ENDPOINT"); fi
          python -m regulation_pipeline.evidence "${args[@]}"
        env:
          MODE: ${{ inputs.mode }}
          ENDPOINT: ${{ inputs.endpoint }}
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
