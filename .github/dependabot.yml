version: 2
updates:
  # Frontend npm dependencies (d3, topojson, vite, typescript, playwright…).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine dev-tooling bumps instead of a dozen.
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint (8.70.1) still requires typescript <6.1, so a TS 7
      # bump fails npm ci. Drop this once it supports TS 7 (#168).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types track the Node runtime CI runs (setup-node node-version: 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Python pipeline dependencies (anthropic, pydantic, typer, pytest…).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep the SHA-pinned GitHub Actions current (Dependabot updates both the
  # pin and the version comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
