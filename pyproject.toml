[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulation-pipeline"
version = "2.0.0"
description = "Researches AI-regulation status per country via the Claude API and writes the site's data files."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.109.0",
    "pydantic>=2",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
update-regulation-data = "regulation_pipeline.cli:main"

# The package lives under scripts/ (not src/) so `python scripts/update_data.py`
# keeps working without an install.
[tool.setuptools.packages.find]
where = ["scripts"]
include = ["regulation_pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16 grew its default rule set from 59 rules to 413. Pin the pre-0.16
# defaults (E4, E7, E9, F) plus our extras so a ruff bump never widens the lint
# set by itself; adopting more rules is its own change (#171).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
